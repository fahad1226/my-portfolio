name: Deploy to Cpnel

on:
    push:
        branches: [master] # Adjust this to your main branch name (could be 'master')
    workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "18" # Adjust to your Node.js version

            - name: Install dependencies
              run: npm install # Or yarn install, depending on your package manager

            - name: Build site
              run: npm run build # Adjust to your build command

            - name: Zip the build
              run: |
                  cd build  # Adjust to your build output directory
                  zip -r ../site.zip .

            - name: Deploy to Capnel
              uses: SamKirkland/FTP-Deploy-Action@v4.3.4
              with:
                  server: ${{ secrets.CAPNEL_SERVER }}
                  username: ${{ secrets.CAPNEL_USERNAME }}
                  password: ${{ secrets.CAPNEL_PASSWORD }}
                  port: ${{ secrets.CAPNEL_PORT }}
                  local-dir: ./
                  server-dir: /home/fahadbin/my-portfolio/
                  dangerous-clean-slate: true

            - name: Execute remote commands
              uses: appleboy/ssh-action@v1.0.0
              with:
                  host: ${{ secrets.CAPNEL_SERVER }}
                  username: ${{ secrets.CAPNEL_USERNAME }}
                  password: ${{ secrets.CAPNEL_PASSWORD }}
                  port: ${{ secrets.CAPNEL_PORT }}
                  script: |
                      cd /home/fahadbin/my-portfolio
                      unzip -o site.zip
